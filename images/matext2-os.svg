<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7e3a1"/><stop offset="100%" stop-color="#a87c2e"/></linearGradient>
    <linearGradient id="r5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff5a64"/><stop offset="100%" stop-color="#c4161c"/></linearGradient>
    <radialGradient id="bg5" cx="50%" cy="40%" r="72%"><stop offset="0%" stop-color="#160a11"/><stop offset="100%" stop-color="#07060c"/></radialGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1d0f18"/><stop offset="100%" stop-color="#0c0710"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg5)"/>

  <text x="600" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f0e8f5" letter-spacing="2">HarmonyOS 7 · 小艺智能体中枢</text>
  <text x="600" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b8a8c8" letter-spacing="2">系统级 Agent · 性能大模型 · 超空间存储</text>

  <!-- center agent orb -->
  <g transform="translate(600 400)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#g5)" stroke-width="3"/>
    <circle cx="0" cy="0" r="52" fill="url(#r5)" opacity="0.18"/>
    <text x="0" y="8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0e8f5">小艺</text>
    <text x="0" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#d4a853" letter-spacing="3">AGENT</text>
  </g>

  <!-- connecting nodes -->
  <g stroke="url(#g5)" stroke-width="2" opacity="0.7" fill="none">
    <path d="M 528 400 L 360 400"/><path d="M 672 400 L 840 400"/>
    <path d="M 560 345 L 420 230"/><path d="M 640 345 L 780 230"/>
    <path d="M 560 455 L 420 570"/><path d="M 640 455 L 780 570"/>
  </g>

  <!-- feature cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="150" y="195" width="200" height="70" rx="14" fill="url(#card5)" stroke="#d4a853" stroke-width="1.5"/>
    <text x="250" y="225" text-anchor="middle" font-size="14" fill="#f0e8f5">跨设备流转</text>
    <text x="250" y="247" text-anchor="middle" font-size="12" fill="#8b7a98">手机·平板·车机</text>

    <rect x="850" y="195" width="200" height="70" rx="14" fill="url(#card5)" stroke="#c4161c" stroke-width="1.5"/>
    <text x="950" y="225" text-anchor="middle" font-size="14" fill="#f0e8f5">性能大模型</text>
    <text x="950" y="247" text-anchor="middle" font-size="12" fill="#8b7a98">20亿+场景学习</text>

    <rect x="150" y="535" width="200" height="70" rx="14" fill="url(#card5)" stroke="#c4161c" stroke-width="1.5"/>
    <text x="250" y="565" text-anchor="middle" font-size="14" fill="#f0e8f5">超空间存储</text>
    <text x="250" y="587" text-anchor="middle" font-size="12" fill="#8b7a98">256G省22G</text>

    <rect x="850" y="535" width="200" height="70" rx="14" fill="url(#card5)" stroke="#d4a853" stroke-width="1.5"/>
    <text x="950" y="565" text-anchor="middle" font-size="14" fill="#f0e8f5">主动服务</text>
    <text x="950" y="587" text-anchor="middle" font-size="12" fill="#8b7a98">情境感知建议</text>
