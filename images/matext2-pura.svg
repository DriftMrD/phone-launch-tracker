<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7e3a1"/><stop offset="100%" stop-color="#a87c2e"/></linearGradient>
    <linearGradient id="r6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff5a64"/><stop offset="100%" stop-color="#c4161c"/></linearGradient>
    <radialGradient id="bg6" cx="50%" cy="42%" r="72%"><stop offset="0%" stop-color="#160a11"/><stop offset="100%" stop-color="#07060c"/></radialGradient>
    <linearGradient id="scr6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#241018"/><stop offset="100%" stop-color="#0c0710"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg6)"/>

  <text x="600" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f0e8f5" letter-spacing="2">Pura X View · 全球首款阔直板</text>
  <text x="600" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b8a8c8" letter-spacing="2">16:9.5 阔型屏 · 96.1% 屏占比 · 201g · 7000mAh</text>

  <!-- wide phone -->
  <g transform="translate(600 400)">
    <rect x="-300" y="-170" width="600" height="340" rx="26" fill="url(#scr6)" stroke="url(#g6)" stroke-width="3"/>
    <rect x="-284" y="-154" width="568" height="308" rx="16" fill="none" stroke="#c4161c" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="-90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#d4a853">16 : 9.5 WIDE</text>
    <rect x="-250" y="-60" width="500" height="120" rx="10" fill="#c4161c" opacity="0.16"/>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f0e8f5">Pura X View</text>
    <text x="0" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b8a8c8">6500nits · 1.05mm 极窄黑边</text>
    <circle cx="-250" cy="-120" r="12" fill="url(#g6)"/>
  </g>

  <!-- stat row -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="640" font-size="38" font-weight="800" fill="url(#r6)">96.1%</text>
    <text x="300" y="666" font-size="13" fill="#b8a8c8">屏占比</text>
    <text x="600" y="640" font-size="38" font-weight="800" fill="url(#g6)">6500</text>
    <text x="600" y="666" font-size="13" fill="#b8a8c8">nits 峰值</text>
    <text x="900" y="640" font-size="38" font-weight="800" fill="url(#r6)">201g</text>
    <text x="900" y="666" font-size="13" fill="#b8a8c8">超轻薄</text>
  </g>
