<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <radialGradient id="bg5" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#0c0c16"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a3a6a"/>
      <stop offset="0.6" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="lens2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a1a5a"/>
      <stop offset="0.6" stop-color="#140a24"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg5)"/>
  <!-- camera plateau -->
  <rect x="430" y="150" width="340" height="340" rx="48" fill="url(#plate)" stroke="#3a3a3c" stroke-width="2"/>
  <circle cx="520" cy="240" r="62" fill="url(#lens)" stroke="#2c2c2e" stroke-width="3"/>
  <circle cx="520" cy="240" r="30" fill="#0a1424"/>
  <circle cx="640" cy="240" r="62" fill="url(#lens2)" stroke="#2c2c2e" stroke-width="3"/>
  <circle cx="640" cy="240" r="30" fill="#140a24"/>
  <circle cx="520" cy="380" r="62" fill="url(#lens)" stroke="#2c2c2e" stroke-width="3"/>
  <circle cx="520" cy="380" r="30" fill="#0a1424"/>
  <circle cx="640" cy="380" r="44" fill="#101012" stroke="#2c2c2e" stroke-width="3"/>
  <!-- aperture ring -->
  <circle cx="640" cy="380" r="22" fill="none" stroke="#ff375f" stroke-width="3" opacity="0.8"/>
  <text x="600" y="640" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f7">三摄系统 · 物理可变光圈 (f/1.4–f/4.0)</text>
