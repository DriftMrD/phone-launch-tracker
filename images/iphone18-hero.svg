<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#0d0a18"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.3" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#af52de" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#af52de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.55" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#ff375f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1430"/>
      <stop offset="0.5" stop-color="#1a0e2e"/>
      <stop offset="1" stop-color="#2a0b1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>
  <rect width="1200" height="675" fill="url(#glowP)"/>
  <rect width="1200" height="675" fill="url(#glowR)"/>
  <!-- Phone lineup silhouettes -->
  <g transform="translate(420,120)">
    <rect x="0" y="0" width="120" height="260" rx="24" fill="url(#device)" stroke="#2c2c2e" stroke-width="2"/>
    <rect x="10" y="12" width="100" height="236" rx="16" fill="url(#screen)"/>
    <rect x="46" y="20" width="28" height="6" rx="3" fill="#000" opacity="0.6"/>
  </g>
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="130" height="300" rx="26" fill="url(#device)" stroke="#2c2c2e" stroke-width="2"/>
    <rect x="11" y="13" width="108" height="274" rx="18" fill="url(#screen)"/>
    <rect x="49" y="22" width="32" height="6" rx="3" fill="#000" opacity="0.6"/>
  </g>
  <g transform="translate(720,140)">
    <rect x="0" y="0" width="110" height="250" rx="22" fill="url(#device)" stroke="#2c2c2e" stroke-width="2"/>
    <rect x="9" y="11" width="92" height="228" rx="14" fill="url(#screen)"/>
  </g>
  <!-- Title -->
  <text x="600" y="600" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f5f5f7">iPhone 18 Pro · Pro Max · Ultra</text>
  <text x="600" y="638" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" fill="#a1a1a6">A20 Pro · iOS 27 · 首款折叠屏 · 特努斯首秀</text>
</svg>
