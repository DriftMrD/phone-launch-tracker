<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="xbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <radialGradient id="xglow" cx="78%" cy="22%" r="60%">
      <stop offset="0" stop-color="#1a5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="xglow2" cx="20%" cy="85%" r="50%">
      <stop offset="0" stop-color="#00c8d8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00c8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xblue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#415fff"/>
      <stop offset="1" stop-color="#00c8d8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#xbg)"/>
  <rect width="1600" height="900" fill="url(#xglow)"/>
  <rect width="1600" height="900" fill="url(#xglow2)"/>
  <g stroke="#16345e" stroke-width="1" opacity=".5">
    <line x1="0" y1="225" x2="1600" y2="225"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="675" x2="1600" y2="675"/>
    <line x1="320" y1="0" x2="320" y2="900"/><line x1="640" y1="0" x2="640" y2="900"/><line x1="960" y1="0" x2="960" y2="900"/><line x1="1280" y1="0" x2="1280" y2="900"/>
  </g>
  <!-- aperture ring -->
  <g transform="translate(1180,450)">
    <circle r="230" fill="none" stroke="url(#xblue)" stroke-width="3" opacity=".8"/>
    <circle r="170" fill="none" stroke="#00c8d8" stroke-width="1.5" opacity=".5"/>
    <circle r="110" fill="#0a1830" stroke="#415fff" stroke-width="2"/>
    <g stroke="#9fc2ff" stroke-width="3">
      <line x1="0" y1="-230" x2="0" y2="-200"/><line x1="163" y1="-163" x2="141" y2="-141"/>
      <line x1="230" y1="0" x2="200" y2="0"/><line x1="163" y1="163" x2="141" y2="141"/>
      <line x1="0" y1="230" x2="0" y2="200"/><line x1="-163" y1="163" x2="-141" y2="141"/>
      <line x1="-230" y1="0" x2="-200" y2="0"/><line x1="-163" y1="-163" x2="-141" y2="-141"/>
    </g>
    <text x="0" y="8" text-anchor="middle" fill="#dfe9ff" font-family="Arial" font-size="34" font-weight="bold">蔡司</text>
  </g>
  <!-- film frame corners -->
  <g stroke="#2a4f86" stroke-width="4" fill="none" opacity=".7">
    <path d="M40 40 h70 M40 40 v70"/><path d="M1560 40 h-70 M1560 40 v70"/>
    <path d="M40 860 h70 M40 860 v-70"/><path d="M1560 860 h-70 M1560 860 v-70"/>
  </g>
  <text x="80" y="250" fill="#9fc2ff" font-family="Arial" font-size="30" letter-spacing="6">vivo</text>
  <text x="80" y="380" fill="#ffffff" font-family="Arial" font-size="120" font-weight="bold">X500 系列</text>
  <rect x="84" y="420" width="320" height="10" fill="url(#xblue)"/>
  <text x="80" y="500" fill="#cfe0ff" font-family="Arial" font-size="40" font-weight="bold">灭霸 500 · 2nm 影像旗舰</text>
  <text x="80" y="560" fill="#7fa6d8" font-family="Arial" font-size="28">蔡司联合定制 · 蓝图光御 900 · OriginOS 7</text>
  <text x="80" y="620" fill="#7fa6d8" font-family="Arial" font-size="28">2026.09.21 发布 · 周杰伦影像大使</text>
  <text x="80" y="820" fill="#4f7099" font-family="Arial" font-size="24">X500 / X500 Pro / X500 Pro Max · 全系直屏三杯齐发</text>
</svg>
