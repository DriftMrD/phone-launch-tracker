<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="dev2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1b3a"/>
      <stop offset="1" stop-color="#1d0d2c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg2)"/>
  <!-- Pro -->
  <g transform="translate(180,140)">
    <rect x="0" y="0" width="150" height="420" rx="30" fill="url(#dev2)" stroke="#3a3a3c" stroke-width="2"/>
    <rect x="13" y="16" width="124" height="388" rx="20" fill="url(#scr2)"/>
    <rect x="60" y="26" width="30" height="7" rx="3.5" fill="#000" opacity="0.6"/>
    <!-- rear camera plateau -->
    <rect x="0" y="0" width="0" height="0"/>
  </g>
  <!-- Pro Max -->
  <g transform="translate(420,110)">
    <rect x="0" y="0" width="170" height="480" rx="34" fill="url(#dev2)" stroke="#3a3a3c" stroke-width="2"/>
    <rect x="15" y="18" width="140" height="444" rx="22" fill="url(#scr2)"/>
    <rect x="69" y="28" width="32" height="7" rx="3.5" fill="#000" opacity="0.6"/>
  </g>
  <!-- Ultra (foldable, closed) -->
  <g transform="translate(700,170)">
    <rect x="0" y="0" width="130" height="360" rx="22" fill="url(#dev2)" stroke="#3a3a3c" stroke-width="2"/>
    <rect x="0" y="0" width="12" height="360" rx="6" fill="#0071e3" opacity="0.35"/>
    <rect x="22" y="14" width="96" height="332" rx="14" fill="url(#scr2)"/>
  </g>
  <!-- Labels -->
  <text x="255" y="600" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f7">iPhone 18 Pro</text>
  <text x="505" y="630" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f7">Pro Max · 6.9″</text>
  <text x="765" y="580" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f7">iPhone Ultra</text>
</svg>
