<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080c"/>
      <stop offset="1" stop-color="#0e0a14"/>
    </linearGradient>
    <linearGradient id="scr3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10204a"/>
      <stop offset="0.5" stop-color="#241040"/>
      <stop offset="1" stop-color="#3a1020"/>
    </linearGradient>
    <linearGradient id="hinge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg3)"/>
  <!-- Open foldable: two halves -->
  <g transform="translate(260,150)">
    <!-- left panel -->
    <rect x="0" y="0" width="330" height="430" rx="10" fill="#0c0c0c" stroke="#2c2c2e" stroke-width="2"/>
    <rect x="14" y="14" width="302" height="402" rx="4" fill="url(#scr3)"/>
    <!-- hinge -->
    <rect x="330" y="0" width="20" height="430" fill="url(#hinge)"/>
    <!-- right panel -->
    <rect x="350" y="0" width="330" height="430" rx="10" fill="#0c0c0c" stroke="#2c2c2e" stroke-width="2"/>
    <rect x="364" y="14" width="302" height="402" rx="4" fill="url(#scr3)"/>
  </g>
  <text x="600" y="640" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f5f5f7">iPhone Ultra · 7.8″ 内屏 · 展开 4.5mm</text>
</svg>
