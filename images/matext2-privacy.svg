<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7e3a1"/><stop offset="100%" stop-color="#a87c2e"/></linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff5a64"/><stop offset="100%" stop-color="#c4161c"/></linearGradient>
    <radialGradient id="bg3" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#160a11"/><stop offset="100%" stop-color="#07060c"/></radialGradient>
    <linearGradient id="scr3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#241018"/><stop offset="100%" stop-color="#0c0710"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg3)"/>

  <text x="600" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f0e8f5" letter-spacing="2">灵盾硬件防窥屏</text>
  <text x="600" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b8a8c8" letter-spacing="2">双击外屏开启 · 侧面视角有效阻隔 · 不影响正面观感</text>

  <!-- front view: clear -->
  <g transform="translate(360 400)">
    <rect x="-120" y="-200" width="240" height="400" rx="30" fill="url(#scr3)" stroke="url(#g3)" stroke-width="3"/>
    <text x="0" y="-150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d4a853">正面 · 清晰可见</text>
    <rect x="-80" y="-110" width="160" height="90" rx="8" fill="#c4161c" opacity="0.18"/>
    <text x="0" y="-60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f0e8f5">私密信息</text>
    <circle cx="0" y="40" r="34" fill="none" stroke="url(#g3)" stroke-width="2" opacity="0.7"/>
    <path d="M -34 40 a 34 34 0 0 1 68 0" fill="none" stroke="url(#r3)" stroke-width="2"/>
    <text x="0" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b7a98">FACE-ON VIEW</text>
  </g>

  <!-- side view: blocked -->
  <g transform="translate(840 400)">
    <rect x="-120" y="-200" width="240" height="400" rx="30" fill="url(#scr3)" stroke="url(#g3)" stroke-width="3"/>
    <text x="0" y="-150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d4a853">侧面 · 内容隐藏</text>
    <rect x="-80" y="-110" width="160" height="90" rx="8" fill="#000" opacity="0.85"/>
    <text x="0" y="-60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a5e">已遮蔽</text>
    <!-- angle lines -->
    <line x1="150" y1="-150" x2="220" y2="-60" stroke="url(#r3)" stroke-width="2" opacity="0.6"/>
    <line x1="150" y1="0" x2="230" y2="0" stroke="url(#r3)" stroke-width="2" opacity="0.6"/>
    <line x1="150" y1="150" x2="220" y2="60" stroke="url(#r3)" stroke-width="2" opacity="0.6"/>
    <text x="0" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b7a98">SIDE-ANGLE BLOCKED</text>
  </g>

  <text x="600" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b8a8c8">硬件级防窥 · 地铁 / 电梯 / 咖啡馆场景防窥必备</text>
</svg>
