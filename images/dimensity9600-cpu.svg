  <text x="1370" y="380" text-anchor="middle" fill="#8b93a3" font-family="Arial" font-size="24">34.5MB 缓存</text>
  <text x="1370" y="420" text-anchor="middle" fill="#5c6373" font-family="Arial" font-size="22">LPDDR6 + UFS 5.0</text>
  <text x="800" y="700" text-anchor="middle" fill="#e8e4dc" font-family="Arial" font-size="28">单核 +17% · 多核 +15% · 多核峰值功耗 −61%</text>
  <text x="800" y="760" text-anchor="middle" fill="#8b93a3" font-family="Arial" font-size="24">能效比约为上代 1.7 倍（媒体测算）</text>
