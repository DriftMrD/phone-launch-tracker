<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="时钟">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#bg5)"/>
  <rect width="400" height="260" fill="url(#glow5)"/>

  <!-- 背景网格 -->
  <g stroke="#06b6d4" stroke-opacity=".08" stroke-width="1">
    <line x1="0" y1="16" x2="400" y2="16"/>
    <line x1="0" y1="48" x2="400" y2="48"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="112" x2="400" y2="112"/>
    <line x1="0" y1="144" x2="400" y2="144"/>
    <line x1="0" y1="176" x2="400" y2="176"/>
    <line x1="0" y1="208" x2="400" y2="208"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="272" x2="400" y2="272"/>
    <line x1="16" y1="0" x2="16" y2="260"/>
    <line x1="48" y1="0" x2="48" y2="260"/>
    <line x1="80" y1="0" x2="80" y2="260"/>
    <line x1="112" y1="0" x2="112" y2="260"/>
    <line x1="144" y1="0" x2="144" y2="260"/>
    <line x1="176" y1="0" x2="176" y2="260"/>
    <line x1="208" y1="0" x2="208" y2="260"/>
    <line x1="240" y1="0" x2="240" y2="260"/>
    <line x1="272" y1="0" x2="272" y2="260"/>
    <line x1="304" y1="0" x2="304" y2="260"/>
    <line x1="336" y1="0" x2="336" y2="260"/>
    <line x1="368" y1="0" x2="368" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
  </g>

  <!-- 主图形：圆角方 + 内嵌圆 -->
  <rect x="140" y="52" width="120" height="120" rx="30" fill="none" stroke="#06b6d4" stroke-opacity=".85" stroke-width="3"/>
  <circle cx="200" cy="112" r="34" fill="#06b6d4" fill-opacity=".22" stroke="#06b6d4" stroke-opacity=".9" stroke-width="2.5"/>
  <circle cx="200" cy="112" r="11" fill="#06b6d4"/>

  <!-- 底部色条 -->
  <rect x="120" y="200" width="160" height="4" rx="2" fill="url(#bar5)"/>

  <!-- 文字 -->
  <text x="200" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#f2f3f7">时钟</text>
  <text x="200" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" letter-spacing="3" fill="#06b6d4" fill-opacity=".9">CLOCK</text>
</svg>
