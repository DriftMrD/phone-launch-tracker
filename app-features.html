<style>
  :root{
    --bg:#f6f3ee; --paper:#fffcf8; --line:rgba(20,16,12,.08); --line2:rgba(20,16,12,.14);
    --ink:#1a1714; --muted:#6b6560; --faint:#9a948e; --head:#161412;
    --chip:#fff; --accent:#1a1714;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1280px;margin:0 auto;padding:0 28px}
  .topnav{display:none}
  .section-switch{display:flex;justify-content:center;gap:6px;padding:14px 16px 0}
  .section-switch a{display:inline-flex;align-items:center;gap:7px;padding:8px 20px;border-radius:100px;font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:#fff}
  .section-switch a:hover{color:var(--ink);border-color:var(--line2)}
  .section-switch a.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rule{height:1px;background:linear-gradient(90deg,#e11d48,#f59e0b 40%,transparent);margin-top:14px}
  header{padding:28px 0 8px}
  h1{font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:.04em}
  .sub{margin-top:10px;color:var(--muted);font-size:14.5px;max-width:820px}
  .panel{position:sticky;top:0;z-index:40;background:rgba(246,243,238,.94);backdrop-filter:blur(12px);padding:12px 0 14px;border-bottom:1px solid var(--line)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{cursor:pointer;user-select:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--line2);color:var(--ink)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35}
  .chip.on{color:var(--ink);border-color:var(--ink);background:#fff;font-weight:600}
  .chip.on .dot{opacity:1}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .dd{position:relative}
  .dd-btn{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:188px;max-width:260px;font-size:13px;color:var(--ink);font-family:inherit;display:flex;align-items:center;gap:8px;text-align:left}
  .dd-btn:hover,.dd.open .dd-btn{border-color:var(--ink)}
  .dd-btn .k{font-size:11px;color:var(--faint);letter-spacing:.08em;flex:none}
  .dd-btn .v{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .dd-btn .c{color:var(--faint);font-size:12px;flex:none}
  .dd-btn .chev{margin-left:2px;width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);opacity:.45;flex:none;margin-top:-3px}
  .dd.open .chev{transform:rotate(-135deg);margin-top:3px}
  .dd-panel{display:none;position:absolute;top:calc(100% + 6px);left:0;width:280px;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px rgba(26,23,20,.12);padding:8px;z-index:50}
  .dd.open .dd-panel{display:block}
  .dd-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .dd-head button{cursor:pointer;background:none;border:0;font:inherit;font-size:12px;color:#6d5bd0}
  .dd-head button:hover{text-decoration:underline}
  .dd-group{font-size:11px;color:var(--faint);letter-spacing:.12em;padding:8px 8px 4px}
  .dd-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
  .dd-item:hover{background:#f6f3ee}
  .dd-item input{accent-color:#1a1714;width:14px;height:14px}
  .dd-item .dot{width:7px;height:7px;border-radius:50%;flex:none}
  input[type=search]{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-size:13px;width:220px;outline:none;font-family:inherit}
  input[type=search]:focus{border-color:var(--ink)}
  .count{font-size:13px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--ink);font-size:15px}
  .tw{margin:18px 0 40px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:13.5px}
  th,td{padding:16px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;z-index:4;background:var(--head);color:#f3efe9;font-size:12px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
  tbody tr:hover{background:#faf6f0}
  tbody tr:last-child td{border-bottom:none}
  td.c-img{width:108px}
  td.c-img img{width:92px;height:60px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eee;display:block}
  td.c-no{width:44px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:22px}
  td.c-brand{width:120px}
  .bname{font-weight:700;display:flex;align-items:center;gap:6px}
  .bname + .bname{margin-top:4px}
  .bname i{width:7px;height:7px;border-radius:50%}
  .phones{display:block;margin-top:4px;font-size:11.5px;color:var(--faint);line-height:1.45}
  .phones a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line2)}
  .phones a:hover{color:var(--ink)}
  td.c-name{width:220px}
  td.c-name b{display:block;font-size:14.5px;line-height:1.4;font-weight:700}
  .src-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .src{display:inline-flex;font-size:11.5px;color:#6d5bd0;text-decoration:none;border-bottom:1px dashed rgba(109,91,208,.45)}
  .src:hover{color:#4c38b0}
  .src.launch{color:#b45309;border-bottom-color:rgba(180,83,9,.4)}
  .src.ext{color:#15803d;border-bottom-color:rgba(21,128,61,.4)}
  .src.ext:hover{color:#166534}
  td.c-mod{width:108px}
  .mtag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
  td.c-desc{color:#4a453f;min-width:280px}
  td.c-note{min-width:260px;color:#4a453f}
  .empty{padding:48px;text-align:center;color:var(--faint)}
  footer{padding:8px 0 48px;color:var(--faint);font-size:12.5px;line-height:1.8}
  @media (max-width:900px){
    .wrap{padding:0 14px}
    .filters{width:100%;margin-left:0}
    input[type=search],.dd-btn{width:100%;max-width:none;min-width:0}
    .dd{flex:1;min-width:0}
    .dd-panel{width:100%}
  }
</style>
</head>

ion-tools-for-iphone-vs-samsung-galaxy-vs-google-pixel-heres-the-winner"},"ext":"https://www.tomsguide.com/phones/i-tested-the-ai-transcription-tools-for-iphone-vs-samsung-galaxy-vs-google-pixel-heres-the-winner","brand":"google","brands":["google"],"phoneIds":["googlepixel11"],"img":"images/apps/recorder.svg"},{"id":"f7","name":"备忘录自然语言建提醒 / 录音进笔记才能摘要","product":"recorder","productName":"录音机","productColor":"#e11d48","desc":"iOS 录音本身转写整洁，但摘要要分享到备忘录；iOS 27 Beta 3 起备忘录支持「今晚 6 点接爸爸」这类自然语言抽时间。录音机仍不是主入口。","note":"苹果把纪要能力放在 Notes 而不是 Recorder。tOS 不要学这个跳转；录音机应是第一现场，笔记只做归档。","source":{"kind":"update","label":"系统更新 · iOS 27","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/recorder.svg"},{"id":"f8","name":"回收站 + 超级岛显示文档处理进度","product":"files","productName":"文件管理","productColor":"#d97706","desc":"HyperOS 4 文件管理新增最近删除回收站；超级岛可实时显示超级文档处理进度。并修复云盘缩略图、macOS 压缩包显示异常。","note":"回收站是文管基础能力，国内竞品已补齐。tOS 文管应把「删除可回」做成默认，压缩包/云盘缩略图当月活质量指标，不要等用户投诉。","source":{"kind":"update","label":"系统更新 · HyperOS 4","href":"updates/xiaomi-hyperos3.html","url":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/"},"ext":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/","brand":"xiaomi","brands":["xiaomi","redmi"],"phoneIds":["mi17max","mi17t","xiaomi18fold","redmik100pro"],"img":"images/apps/files.svg"},{"id":"f9","name":"AI 意图搜索：模糊描述跨应用找文件","product":"files","productName":"文件管理","productColor":"#d97706","desc":"ColorOS 16 可用自然语言搜文件/日程/截图，不记文件名也能定位；系统内可浏览并转换 60+ 文档格式（Keynote/PSD/CAD 等），小布可对文档生成思维导图。","note":"文管的下一代入口是「描述」不是路径。tOS 应让搜索听得懂「上周客户那份报价 PDF」，并覆盖办公格式预览，减少跳 WPS。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/files.svg"},{"id":"f10","name":"AI 文件管家：按主题归类 + 输入法找文件","product":"files","productName":"文件管理","productColor":"#d97706","desc":"OriginOS 7 已官宣（9/16 开发者大会）：AI 文件管家按主题归类相关文件，并可向小 V 问文件内容；输入法在聊天时能推荐本机文档/日程/联系人。现款 X Fold6 / S60 / iQOO 15T / Neo11 出厂仍是 OriginOS 6，该能力随 OriginOS 7 升级，不是已装功能。","note":"文件被输入法「带出来」比在文管里翻更快。tOS 可做：聊天/笔记输入时推荐最近相关文档，文管自己负责主题聚类。不要把下一代系统海报写成现款卖点。","source":{"kind":"update","label":"媒体转述 · OriginOS 7 官宣","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/files.svg"},{"id":"f11","name":"My Files 底栏搜索 + AI 摘要仅旗舰","product":"files","productName":"文件管理","productColor":"#d97706","desc":"One UI 8.5 把搜索栏移到底部、加 Storage Share 跨设备看平板/PC 文件。AI 文件摘要却只给 S26：S25 / Z Fold 7 同系统无开关，社区认为分层不公。","note":"UI 重构方向对（单手搜索），但同系统砍 AI 会伤口碑。tOS 文管 AI 摘要应按存储/权限能力分级，不要按销售机型卡死。","source":{"kind":"update","label":"系统更新 · One UI 8.5","href":"updates/samsung-my-files.html","url":"https://sammyguru.com/exclusive-samsung-my-files-app-one-ui-8-5/"},"ext":"https://sammyguru.com/exclusive-samsung-my-files-app-one-ui-8-5/","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/files.svg"},{"id":"f12","name":"Storage Space 2.0 无损压缩腾空间","product":"files","productName":"文件管理","productColor":"#d97706","desc":"MagicOS 11 存储空间 2.0：无损压缩 + 清冗余，官方称最多腾出约 60GB。与换机演示里「迁完多出 10GB」是同一套空间叙事。","note":"海外用户对「系统吃存储」极敏感。tOS 文管应有可见的压缩/清理账单：压缩了什么、能还原、不误伤 WhatsApp 媒体。","source":{"kind":"update","label":"系统更新 · MagicOS 11","href":"updates/honor-yoyo.html","url":"https://www.huaweicentral.com/honor-magicos-10-june-2026-update-brings-new-yoyo-ai-features/"},"ext":"https://www.huaweicentral.com/honor-magicos-10-june-2026-update-brings-new-yoyo-ai-features/","brand":"honor","brands":["honor"],"phoneIds":["honor600","honorx80promax","magicvflip3","honorrobotphone"],"img":"images/apps/files.svg"},{"id":"f13","name":"分布式文件管理 + 超空间存储","product":"files","productName":"文件管理","productColor":"#d97706","desc":"HarmonyOS 7 强化超级终端与分布式文件：跨设备拖文件更稳。超空间存储给 256GB 机型多出约 22GB 可用空间，被报告称为变相延长换机周期。","note":"「同等容量更好用」是文管可量化的卖点。tOS 应对 128/256GB 机给出清理+压缩的可见收益，而不是只在旗舰上讲云盘。","source":{"kind":"launch","label":"发布会 · Mate XT 2 / nova 16 SE","href":"reports/huaweimatext2.html","url":"https://consumer.huawei.com/"},"ext":"https://consumer.huawei.com/","brand":"huawei","brands":["huawei"],"phoneIds":["huaweimatext2","huaweinova16","huaweinova16se"],"img":"images/apps/files.svg"},{"id":"f14","name":"原子工作台：文档与文件跨窗拖放","product":"files","productName":"文件管理","productColor":"#d97706","desc":"X Fold6 原子工作台支持四窗口，文档/浏览器/微信/邮件同屏，文件可在应用间拖放，全局任务栏接近桌面效率。OriginOS 7 计划把原子工作台下放到直板机。","note":"折叠屏文管的关键是拖放，不是多一个文件夹页。tOS 大屏/折叠应优先做跨窗拖文件 + 任务组，直板机用分屏兜住高频场景。","source":{"kind":"launch","label":"发布会 · X Fold6","href":"reports/vivoxfold6.html","url":"https://www.vivo.com/"},"ext":"https://www.vivo.com/","brand":"vivo","brands":["vivo"],"phoneIds":["vivoxfold6"],"img":"images/apps/files.svg"},{"id":"f15","name":"锁屏媒体播放器：圆形按钮 + 实时波形","product":"player","productName":"播放器","productColor":"#7c3aed","desc":"One UI 9 锁屏播放器改为圆形按钮、实时波形，色温跟专辑封面走。被放进稳定版主功能，而不是主题商店插件。","note":"播放器差异化在锁屏/岛区，不在本地解码列表。tOS 播放器应把锁屏卡片 + 流体云歌词当成主表面，而不是再做一套独立皮肤页。","source":{"kind":"update","label":"系统更新 · One UI 9","href":"updates/samsung-oneui9-beta.html","url":"https://gadgets.beebom.com/guides/best-one-ui-9-features"},"ext":"https://gadgets.beebom.com/guides/best-one-ui-9-features","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/player.svg"},{"id":"f16","name":"锁屏岛全屏歌词（含酷狗概念版）","product":"player","productName":"播放器","productColor":"#7c3aed","desc":"ColorOS 16 八月体验：锁屏岛全屏歌词新增酷狗概念版，抬眼即见。和系统流体云是同一套「正在播放」表面。","note":"歌词岛要能接头部音乐 App，不能只服务自有播放器。tOS 应先打通 Spotify / YouTube Music / 本地播放器三套媒体会话。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/player.svg"},{"id":"f17","name":"AirPods 自适应模式强度滑块 + 自定义 EQ","product":"player","productName":"播放器","productColor":"#7c3aed","desc":"iOS 27 控制中心可调 AirPods 通透/降噪平衡；发布会还提到自定义 EQ。播放体验绑在耳机系统设置，不在独立播放器 App。","note":"苹果把「听感」放在系统音频层。tOS 若做播放器，EQ/空间音频应进系统声音，而不是锁死在自有 App 里。","source":{"kind":"launch","label":"发布会 · iPhone 18 / iOS 27","href":"reports/iphone18.html","url":"https://www.apple.com/apple-events/"},"ext":"https://www.apple.com/apple-events/","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/player.svg"},{"id":"f18","name":"4K Live 动态照片当媒体资产","product":"player","productName":"播放器","productColor":"#7c3aed","desc":"OriginOS 6.0 16.0.14.2 相机可录 4K Live 动态影像。播放/相册侧要能保留动态效果，否则只是相机卖点、播放器接不住。","note":"Live 图是相机和播放器的交接件。tOS 播放器/相册必须声明：动态照片能原样播、能导出静帧，避免「拍得到、看丢失」。","source":{"kind":"update","label":"系统更新 · OriginOS 6","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/player.svg"},{"id":"f19","name":"Writing Tools：全系统校对 / 重写 / 四种摘要","product":"notes","productName":"记事本","productColor":"#16a34a","desc":"任意输入框可触发校对、重写、摘要（标准/要点/列表/表格）。PCMag 称「如宣传可用」，但 iPhone 上要点太多次；Compose 还要登录 ChatGPT。","note":"笔记 AI 应是系统输入层，不是笔记 App 私有。tOS 记事本先做「圈选即改写/摘要」，触控路径压到两步以内，生成不要绑第三方账号。","source":{"kind":"update","label":"系统更新 · iOS 26/27","href":"updates/apple-writing-tools.html","url":"https://www.pcmag.com/explainers/how-smart-is-apple-intelligence-i-tried-every-feature-heres-the-verdict"},"ext":"https://www.pcmag.com/explainers/how-smart-is-apple-intelligence-i-tried-every-feature-heres-the-verdict","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/notes.svg"},{"id":"f20","name":"Samsung Notes 胶带笔 + Gemini Notebook","product":"notes","productName":"记事本","productColor":"#16a34a","desc":"One UI 9：Notes 可用胶带遮敏感信息再分享；Gemini Notebook 能吃 PDF/录音/截图，吐摘要、AI 视频、演示稿、播客、测验。","note":"胶带是分享场景的小而美；Notebook 是重入口。tOS 记事本可先做「分享前遮挡」+「录音/PDF 进同一条笔记」，不必一上来生成播客。","source":{"kind":"update","label":"系统更新 · One UI 9","href":"updates/samsung-oneui9-beta.html","url":"https://gadgets.beebom.com/guides/best-one-ui-9-features"},"ext":"https://gadgets.beebom.com/guides/best-one-ui-9-features","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/notes.svg"},{"id":"f21","name":"AI 闪记 / Mind Space：三指上滑即归档","product":"notes","productName":"记事本","productColor":"#16a34a","desc":"三指上滑或 Snap Key 把屏幕文字/图/录音丢进小布记忆，自动分类、合集摘要，长视频也能出章节。八月更新便签可换字体皮肤，笔记图片可直接涂鸦。","note":"这是目前安卓里最完整的「看见即记下」。tOS 记事本应有系统手势闪记，落到本地笔记而不是新壳 App；视频摘要和涂鸦是下一步，不是第一步。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/notes.svg"},{"id":"f22","name":"笔记 AI 语义搜索 + 长视频变笔记","product":"notes","productName":"记事本","productColor":"#16a34a","desc":"MagicOS 10 八月版：笔记支持 AI 语义搜索；YOYO 记忆可对抖音/B 站/小红书/本地视频三指下滑出摘要，视频教程直接变笔记。","note":"语义搜比文件夹更重要。tOS 记事本优先「用一句话找到三个月前那条」，视频转笔记可复用录音纪要模型，不必单 带。","note":"从「记时间」变成「排任务」会和待办抢位置。tOS 更稳的是日历管事件、任务管待办，两者可互推，不要合成一个含糊的 AI 盒子。","source":{"kind":"update","label":"系统更新 · OriginOS 7（已官宣）","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/calendar.svg"},{"id":"f29","name":"Siri 个人语境读日历","product":"calendar","productName":"日历","productColor":"#2563eb","desc":"WWDC / iOS 27：Siri 结合邮件、日历、照片、消息理解意图，可把对话里的安排落到日程；跨 iPhone/iPad/Mac 对话续接。大陆与欧盟暂不上 Siri AI。","note":"助手读写日历必须是系统能力。tOS 要把日历做成公共服务：助手、截图、短信都能写，用户在日历里能看到来源和撤销。","source":{"kind":"launch","label":"发布会 · WWDC / iPhone 18","href":"reports/wwdc2026.html","url":"https://developer.apple.com/wwdc26/"},"ext":"https://developer.apple.com/wwdc26/","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/calendar.svg"},{"id":"f30","name":"锁屏横竖屏时钟异常（已修一轮）","product":"clock","productName":"时钟","productColor":"#0891b2","desc":"One UI 9 Beta 4 专门修了锁屏横竖屏时钟显示异常，和实时通知计时器截断一起进稳定版前的修复包。说明时钟仍是锁屏事故高发区。","note":"时钟产品的口碑在锁屏，不在闹钟列表。tOS 时钟要覆盖折叠/横屏/AOD 三种表面，发版前当回归用例，而不是主题附赠。","source":{"kind":"update","label":"系统更新 · One UI 9 Beta","href":"updates/samsung-oneui9-beta.html","url":"https://gadgets.beebom.com/news/samsung-officially-releases-stable-one-ui-9-update-with-galaxy-z-fold-8-series"},"ext":"https://gadgets.beebom.com/news/samsung-officially-releases-stable-one-ui-9-update-with-galaxy-z-fold-8-series","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/clock.svg"},{"id":"f31","name":"超级岛 / 灵动胶囊当「下一件事」表面","product":"clock","productName":"时钟","productColor":"#0891b2","desc":"小米超级岛、荣耀灵动胶囊把倒计时、取餐、出行状态顶到锁屏/状态栏。它们在抢时钟的「下一事件」位置，而不只是通知。","note":"时钟要主动占领岛区：下一个闹钟、倒计时、世界时钟应能进流体云。否则这个表面会被助手和外卖码吃掉。"," launch","label":"发布会 · nova 16 SE","href":"reports/huaweinova16se.html","url":"https://consumer.huawei.com/"},"ext":"https://consumer.huawei.com/","brand":"huawei","brands":["huawei"],"phoneIds":["huaweimatext2","huaweinova16","huaweinova16se"],"img":"images/apps/calc.svg"},{"id":"f35","name":"桌面汇率换算卡片","product":"calc","productName":"计算器","productColor":"#64748b","desc":"ColorOS 16 八月生活卡片：2×2 / 4×2 汇率换算。把计算器最海外的场景直接放到桌面。","note":"汇率/单位换算是海外刚需。tOS 计算器应默认带汇率小组件，数据源可离线缓存，不要藏在科学计算器第二页。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/calc.svg"},{"id":"f36","name":"Wallet 扫 QR 生成数字通行证","product":"scan","productName":"扫一扫","productColor":"#0d9488","desc":"iOS 27 Beta 3：Wallet 扫描 QR 可生成会员卡/活动票/积分卡。扫一扫能力进了钱包，而不是独立扫码 App。","note":"扫码结果要有落点：日历、钱包、浏览器、支付。tOS 扫一扫应做成系统服务，识别后按类型分发，而不是只打开一个相机框。","source":{"kind":"update","label":"系统更新 · iOS 27","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/scan.svg"},{"id":"f37","name":"三折叠外屏直接扫码","product":"scan","productName":"扫一扫","productColor":"#0d9488","desc":"Mate XT 2 外屏可在折叠态完成扫码、回消息，不必展开。被报告称为三折叠日常可用性的关键补强。","note":"折叠机扫一扫的第一场景是外屏支付/入场。tOS 外屏必须预置扫码，延迟和手电筒策略按单手设计。","source":{"kind":"launch","label":"发布会 · Mate XT 2","href":"reports/huaweimatext2.html","url":"https://consumer.huawei.com/"},"ext":"https://consumer.huawei.com/","brand":"huawei","brands":["huawei"],"phoneIds":["huaweimatext2"],"img":"images/apps/scan.svg"},{"id":"f38","name":"小折叠外屏快速扫码","product":"scan","productName":"扫一扫","productColor":"#0d9488","desc":"Magic V Flip3 外屏可独立跑社交/办公 App，配合灵动胶囊完成回消息、看日程、快速扫码，不展开也能过高频操作。","note":"与华为同一课：外屏扫码是折叠体验清单里的必选项，不是演示。tOS 小折叠要保证扫码全屏、亮度拉满、识别区不被胶囊挡住。","source":{"kind":"launch","label":"发布会 · Magic V Flip3","href":"reports/magicvflip3.html","url":"https://www.honor.com/global/"},"ext":"https://www.honor.com/global/","brand":"honor","brands":["honor"],"phoneIds":["magicvflip3"],"img":"images/apps/scan.svg"},{"id":"f39","name":"闪记扫描点餐码 / 超级岛展示取餐码","product":"scan","productName":"扫一扫","productColor":"#0d9488","desc":"ColorOS 闪记可扫描点餐码并记账单；HyperOS 超级岛已接麦当劳取餐码，锁屏一键出示。扫码从「打开相机」变成「码自己冒出来」。","note":"取餐码/点餐码是扫一扫的日常形态。tOS 应让短信/通知里的码进岛区或钱包，扫一扫负责现场码，两头都要有。","source":{"kind":"update","label":"系统更新 · ColorOS / HyperOS","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["xiaomi","redmi","oppo"],"phoneIds":["mi17max","mi17t","xiaomi18fold","redmik100pro","opporeno16","oppoa7promax"],"img":"images/apps/scan.svg"},{"id":"f40","name":"Galaxy Themes 弹窗广告 + 更新坟场","product":"theme","productName":"主题商城","productColor":"#db2777","desc":"媒体 2025-10 起集中批评：打开即弹 gacha 广告、自动更新不如 Play、新主题零评分且像 AI 生成。Good Lock 反而成了真正的个性化入口。","note":"主题商店若靠弹窗活，产品就死了。tOS 主题商城应零广告、更新走系统更新、和锁屏/图标包同一质量门槛，不要做成第二应用商店。","source":{"kind":"update","label":"系统更新 · Galaxy Themes","href":"updates/samsung-galaxy-themes.html","url":"https://www.androidauthority.com/p-3607055/"},"ext":"https://www.androidauthority.com/p-3607055/","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/theme.svg"},{"id":"f41","name":"液态玻璃 / 柔光玻璃成为系统皮肤","product":"theme","productName":"主题商城","productColor":"#db2777","desc":"iOS 27 Liquid Glass、HyperOS 4 柔光玻璃、MagicOS 11 动态液态玻璃都把「主题」上收到系统视觉层。可调的是材质和锁屏，不是一套第三方主题包。","note":"2026 主题竞争从商店皮肤变成系统材质。tOS 主题商城应卖图标/壁纸/锁屏组合，并跟系统玻璃材质兼容，避免一换主题就打碎液态玻璃。","source":{"kind":"update","label":"系统更新 · iOS 27 / HyperOS 4 / MagicOS 11","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple","xiaomi","redmi","honor"],"phoneIds":["iphone18","mi17max","mi17t","xiaomi18fold","redmik100pro","honor600","honorx80promax","magicvflip3","honorrobotphone"],"img":"images/apps/theme.svg"},{"id":"f42","name":"便签换字体皮肤；相册浅色编辑","product":"theme","productName":"主题商城","productColor":"#db2777","desc":"ColorOS 16 八月：便签可换字体和皮肤；相册编辑支持深/浅/跟随系统。个性化下放到具体 App，而不是只在主题商店换整包。","note":"单 App 皮肤比整机主题更安全。tOS 可先给笔记/时钟/计算器提供官方字体与对比度选项，再考虑整包主题。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/theme.svg"},{"id":"f43","name":"Game Booster 内嵌叠加层 + Good Lock","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"One UI 9 游戏中可调分辨率和性能模式，不必退出。Good Lock 承担图标/多锁屏等深度玩机；Dual Recording 被挪到 Good Lock 且未充分告知，引发抱怨。","note":"玩机工具可以深，但不能把常用相机能力藏进去还不通知。tOS 实验室功能要可发现、可回退，游戏工具条保持前台可及。","source":{"kind":"update","label":"系统更新 · One UI 9","href":"updates/samsung-oneui9-beta.html","url":"https://gadgets.beebom.com/guides/best-one-ui-9-features"},"ext":"https://gadgets.beebom.com/guides/best-one-ui-9-features","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/labs.svg"},{"id":"f44","name":"应用五分身（含串号争议）","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"ColorOS 16 从双开升到 5 个分身，面向游戏/小微商户。用户反馈小红书分身账号会串号，「数据完全隔离」未达预期。","note":"分身是玩机高频，隔离失败就是事故。tOS 多开必须账号/存储/通知三隔离，并在设置里显示每个分身占用的空间。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/labs.svg"},{"id":"f45","name":"原子工作台下放直板机 + 五应用任务组","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"OriginOS 7：原子工作台计划下放直板，首帧可打断，五应用任务组可打包流转。现款折叠 X Fold6 已先享四窗口。","note":"玩机里最有生产力的是任务组，不是彩蛋。tOS 可做「一组 App 一键恢复」给海外商务机，比再堆动画更值。","source":{"kind":"update","label":"系统更新 · OriginOS 7","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/labs.svg"},{"id":"f46","name":"YOYO GUI Agent：看懂屏幕自己点","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"MagicOS 11 用纯视觉 GUI Agent 模拟点击滑动，无需 App 适配 API；演示 14 步出差（日历→12306→美团→同步日程）。准确率待长期验证。","note":"这是玩机天花板，也是风险天花板。tOS 若做 Agent 点选，必须逐步确认、可录制回放、敏感页（支付/权限）拦截，不能静默连点。","source":{"kind":"update","label":"系统更新 · MagicOS 11","href":"updates/honor-yoyo.html","url":"https://www.huaweicentral.com/honor-upgrades-yoyo-ai-assistant-features-for-magicos-10-devices/"},"ext":"https://www.huaweicentral.com/honor-upgrades-yoyo-ai-assistant-features-for-magicos-10-devices/","brand":"honor","brands":["honor"],"phoneIds":["honor600","honorx80promax","magicvflip3","honorrobotphone"],"img":"images/apps/labs.svg"},{"id":"f47","name":"YOYO Pro：百轮自动执行（Robot Phone）","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"Robot Phone 首发 YOYO Pro，长指令、百轮以上自动执行，再加机械云台具身交互。软件玩机和硬件云台绑在一起卖。","note":"长任务执行是助手，也是玩机。tOS 可先在实验室开关里提供「多步脚本」，默认关闭，成功标准是可中断、可审计。","source":{"kind":"launch","label":"发布会 · Robot Phone","href":"reports/honorrobotphone.html","url":"https://www.honor.com/global/"},"ext":"https://www.honor.com/global/","brand":"honor","brands":["honor"],"phoneIds":["honorrobotphone"],"img":"images/apps/labs.svg"},{" amsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/assistant.svg"},{"id":"f65","name":"超级小爱 2.0 专家模式：跨应用跨设备执行","product":"assistant","productName":"语音助手","productColor":"#4f46e5","desc":"一句话自规划调用系统应用及支付宝/高德等；任务态进超级岛。专家模式耗积分，额度用完要订阅。圈搜、电源键长按持续对话已在 HyperOS 3/4 铺开。","note":"助手开始走订阅制。tOS 基础圈搜/执行应免费；复杂跨端可以增值，但要在设置里写清额度，避免「系统助手突然要付费」。","source":{"kind":"update","label":"系统更新 · HyperOS 4","href":"updates/xiaomi-hyperos3.html","url":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/"},"ext":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/","brand":"xiaomi","brands":["xiaomi","redmi"],"phoneIds":["mi17max","mi17t","xiaomi18fold","redmik100pro"],"img":"images/apps/assistant.svg"},{"id":"f66","name":"小布记忆：搜索 / 问答 / 推荐闭环","product":"assistant","productName":"语音助手","productColor":"#4f46e5","desc":"ColorOS 16 以记忆搜索、问答、推荐为矩阵，闪记内容可问、可合集。团购券临期会在建议/流体云出现。EU 版本推送曾晚数月。","note":"记忆型助手比聊天型更贴近系统应用。tOS 应用数据应能被助手检索（需权限），并给「为什么推这条」的解释，海外机还要按区域节奏同步。","source":{"kind":"update","label":"系统更新 · ColorOS 16","href":"updates/oppo-coloros16.html","url":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/"},"ext":"https://xdaforums.com/t/coloros-16-general-discussion-updates.4764786/","brand":"oppo","brands":["oppo"],"phoneIds":["opporeno16","oppoa7promax"],"img":"images/apps/assistant.svg"},{"id":"f67","name":"YOYO Next：MCP + GUI Agent 接管系统","product":"assistant","productName":"语音助手","productColor":"#4f46e5","desc":"MagicOS 11 给 YOYO 系统级 MCP 权限，可接管系统与三方 App；混合端云推理，接 DeepSeek-V4。12GB 以下机型会砍跨软件 AI。","note":"权限过大的助手等于新的无障碍漏洞。tOS 要对助手操作做权限清单和操作日志，内存分级可以，但不能静默少功能。","source":{"kind":"update","label":"系统更新 · MagicOS 11","href":"updates/honor-yoyo.html","url":"https://www.toutiao.com/article/7663362861230375474/"},"ext":"https://www.toutiao.com/article/7663362861230375474/","brand":"honor","brands":["honor"],"phoneIds":["honor600","honorx80promax","magicvflip3","honorrobotphone"],"img":"images/apps/assistant.svg"},{"id":"f68","name":"小艺中枢：2100+ 系统能力的 Agent","product":"assistant","productName":"语音助手","productColor":"#4f46e5","desc":"HDC / HarmonyOS 7：小艺从语音助手变为智能体，官方称 2100+ 系统能力、500+ Skill、2000+ 鸿蒙智能体，可跨端传文件、行程规划。开发者 Beta 已开，公开落地仍需应用适配。","note":"能力数量不是产品。tOS 应挑 20 个可演示的跨应用任务做验收（订票、转文件、建日程），并标明哪些地区/语言不可用。","source":{"kind":"launch","label":"发布会 · HDC 2026 / Mate XT 2","href":"reports/hdc2026.html","url":"https://developer.huawei.com/"},"ext":"https://developer.huawei.com/","brand":"huawei","brands":["huawei"],"phoneIds":["huaweimatext2","huaweinova16","huaweinova16se"],"img":"images/apps/assistant.svg"},{"id":"f69","name":"蓝心小 V / 小 V Pro 系统级 Agent","product":"assistant","productName":"语音助手","productColor":"#4f46e5","desc":"OriginOS 6 出厂即带圈搜、小 V 记忆；9/16 OriginOS 7 正式发布，小 V 升级 Pro 模式：任务自动拆解 + 跨端执行，官方称可调用 6000+ 原子能力、支持上万种任务。典型演示是把收藏的攻略、相册截图、历史笔记串成一份含交通住宿景点美食的旅行路书，遇航班变动还能动态调整。海外 Funtouch 几乎没有同级讨论和公开月更。","note":"国内海报和海外 Funtouch 是两套产品。tOS 对标要以海外实际预装为准；圈搜和小 V 记忆 2.0 的自动打标签更值得搬。","source":{"kind":"update","label":"系统更新 · OriginOS 6/7","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/assistant.svg"},{"id":"f70","name":"Gemini 仍是 Pixel 系统入口","product":"assistant","productName":"语音助手","productColor":"#4f46e5","desc":"Pixel 11 发布叙事是 AI 接管像素；录音机摘要、系统搜索即时索引都通向 Gemini。Android 17 本身很少点名独立系统 App。","note":"谷歌把系统应用当 Gemini 的工具。tOS 相反：应用是产品，助手是总线。不要让录音机/日历没有自己的主按钮。","source":{"kind":"launch","label":"发布会 · Pixel 11","href":"reports/googlepixel11.html","url":"https://store.google.com/"},"ext":"https://store.google.com/","brand":"google","brands":["google"],"phoneIds":["googlepixel11"],"img":"images/apps/assistant.svg"},{"id":"f71","name":"闹钟音量与铃声音量解绑","product":"clock","productName":"时钟","productColor":"#0891b2","desc":"iOS 27 在「设置 · 声音与触感」里把闹钟音量从铃声音量中拆出来，两者不再共用一个滑块。此前调小铃声会连带把闹钟调小导致睡过头，或反过来被满音量通知吓到。","note":"零成本、高频痛点、不看硬件——最该优先搬的一类。验收要拆细：闹钟、计时器、通知三者是否都独立；静音/勿扰模式下闹钟是否照常响。","source":{"kind":"update","label":"系统更新 · iOS 27 正式版","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/clock.svg"},{"id":"f72","name":"视频任意一帧直接存成照片","product":"gallery","productName":"相册","productColor":"#ea580c","desc":"iOS 27 支持把视频里的某一帧直接存为照片，不用截图再裁。拍小孩、宠物这类动体时，能从一段视频里挑出最清晰的一帧。","note":"体量小但用一次就回不去。实现上有两个坑：存下来的帧要不要继承原视频的 HDR / 运动照片元数据；以及它会不会被「重复照片」检测误判成重复项。","source":{"kind":"update","label":"系统更新 · iOS 27 正式版","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/gallery.svg"},{"id":"f73","name":"快捷指令用一句话生成","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"iOS 27 的「描述一个快捷指令」：点加号、用自然语言写出想要的效果（离开公司时给家人发 ETA、CarPlay 连上时播某个播放列表），系统自动把步骤拼出来，之后还能继续用口语微调或手动改步骤。","note":"快捷指令多年「能做但没人用」，卡点从来不是能力而是搭积木的编辑成本，自然语言生成正打在这点上。前提是生成结果必须可展开、可手动改，否则出错时用户无从排查。旧编辑器仍要保留。","source":{"kind":"update","label":"系统更新 · iOS 27 正式版","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/labs.svg"},{"id":"f74","name":"密码 App：泄露提醒 + 应用内直接改密码","product":"passwords","productName":"密码管理","productColor":"#0f766e","desc":"iOS 27 的「密码」App 会提示哪些账号已卷入泄露，并支持在应用内直接发起修改流程，不用自己去网站找改密码入口。","note":"密码管理正从浏览器的附属能力升级成系统级独立 App。要做得先定三件事：泄露检测的数据源与更新频率、改密码深链的站点覆盖率、跨端同步的加密与账号恢复路径。","source":{"kind":"update","label":"系统更新 · iOS 27 正式版","href":"updates/apple-ios27.html","url":"https://www.macrumors.com/roundup/ios-27"},"ext":"https://www.macrumors.com/roundup/ios-27","brand":"apple","brands":["apple"],"phoneIds":["iphone18"],"img":"images/apps/passwords.svg"},{"id":"f75","name":"Good Lock 24 模块收尾适配 One UI 9","product":"labs","productName":"玩机","productColor":"#dc2626","desc":"9 月 2 日起 Good Lock 的 24 个模块（其中 2 个非全球可用）全部兼容 One UI 9；随后 Home Up 18.0.00.36 修整合侧屏不显示最近应用、DIY 主屏项目偶发不显示，NavStar 9.0.00.16 修导航栏按钮间距与折叠/平板 UI，One Hand Operation+ 9.3.13.0 修重启后手势失效。","note":"真正值得学的不是功能，是节奏管理：beta 期公开「还有几个模块没适配」的清单，逐周收敛，稳定版前清零。tOS 若也要建玩机模块池，需要同样的兼容度看板，否则用户升级后第一反应是「我的模块废了」。","source":{"kind":"update","label":"系统更新 · One UI 9","href":"updates/samsung-oneui9-beta.html","url":"https://gadgets.beebom.com/news/samsung-officially-releases-stable-one-ui-9-update-with-galaxy-z-fold-8-series"},"ext":"https://gadgets.beebom.com/news/samsung-officially-releases-stable-one-ui-9-update-with-galaxy-z-fold-8-series","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/labs.svg"},{"id":"f76","name":"小米换机 Mi Mover 4.6.1.7（9/16 月更）","product":"clone","productName":"换机","productColor":"#9333ea","desc":"9 月 16 日应用商店更新：Mi Mover 4.6.1.7（38.71MB）、家人守护 Family Guard 3.14.09.04.00、HyperOS 录屏 4.16.2.8.1、HyperOS 壁纸等一批系统应用同日刷新。","note":"换机是换机周期里唯一被高频使用的工具，版本迭代如此密集说明仍在补兼容性。tOS 换机该盯的不是传输速度（已有公开 benchmark 可对标），而是「旧机侧数据项覆盖率」——通讯录/微信记录/桌面布局/系统设置，哪项漏了用户立刻感知。","source":{"kind":"update","label":"系统更新 · HyperOS 3","href":"updates/xiaomi-hyperos3.html","url":"https://hyperosupdates.com/latest-apps"},"ext":"https://hyperosupdates.com/latest-apps","brand":"xiaomi","brands":["xiaomi","redmi"],"phoneIds":["mi17max","mi17t","xiaomi18fold","redmik100pro"],"img":"images/apps/clone.svg"},{"id":"f77","name":"跨苹果互联：通知同步、微信镜像回复、云相册同步","product":"clone","productName":"换机","productColor":"#9333ea","desc":"澎湃 OS 3 打通苹果设备：iPhone 通知同步到小米手机、可镜像并回复微信/QQ、文件照片视频互传、云相册同步、一键热点与位置共享；Mac 上可开三个手机应用窗，iPad 上跑 HyperOS 桌面并支持多任务。同期新增独立「密码」App 打通苹果生态。","note":"这是把「换机」从一次性迁移工具，升级成跨生态常驻通道——用户不必二选一。若目标市场是安卓换安卓，优先级不高；但若用户群里存在 iOS 转换者，这一步直接决定首周留存。","source":{"kind":"update","label":"系统更新 · HyperOS 3","href":"updates/xiaomi-hyperos3.html","url":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/"},"ext":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/","brand":"xiaomi","brands":["xiaomi","redmi"],"phoneIds":["mi17max","mi17t","xiaomi18fold","redmik100pro"],"img":"images/apps/clone.svg"},{"id":"f78","name":"新增独立「密码」App 并打通苹果设备","product":"passwords","productName":"密码管理","productColor":"#0f766e","desc":"澎湃 OS 3.0 版本更新中新增独立的密码管理工具，官方表述是「打通苹果设备，实现更便捷的密码管理体验」，与高级数据保护、双重认证登录同批上线。","note":"和苹果同期押注同一件事，说明密码管理正被重新定义为系统级 App 而非浏览器功能。要跟进的话，先解决跨端同步的加密与恢复，再谈填充体验；否则用户不敢把真密码放进来。","source":{"kind":"update","label":"系统更新 · HyperOS 3","href":"updates/xiaomi-hyperos3.html","url":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/"},"ext":"https://nokiamob.net/2025/09/24/hyperos-3-global-released-new-ui-ai-tools-and-cross-device-features/","brand":"xiaomi","brands":["xiaomi","redmi"],"phoneIds":["mi17max","mi17t","xiaomi18fold","redmik100pro"],"img":"images/apps/passwords.svg"},{"id":"f79","name":"锁屏直接扫码，无需先解锁","product":"scan","productName":"扫一扫","productColor":"#0d9488","desc":"OriginOS 7 在锁屏界面直接给出扫码入口，不用解锁再去找扫一扫。国内支付/加好友/取餐都是高频动作，解锁那一步是纯摩擦。","note":"典型的「入口前移」改动，成本低收益高。安全边界要画死：锁屏扫码只允许调起相机 + 识别结果，绝不暴露通知内容、相册或付款码列表，否则就是隐私事故。","source":{"kind":"update","label":"系统更新 · OriginOS 7","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/scan.svg"},{"id":"f80","name":"相册主动推荐重复与模糊照片供清理","product":"gallery","productName":"相册","productColor":"#ea580c","desc":"OriginOS 7 相册会主动挑出重复、模糊的相似照片并给出清理建议，不用用户自己翻几千张图找。","note":"苹果做的是 Clean Up 消除路人，vivo 做的是「批量识别该删的」——后者更贴近存储焦虑，也更实用。风险集中在误删：必须可逐张预览、可撤销、默认不自动执行。","source":{"kind":"update","label":"系统更新 · OriginOS 7","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/gallery.svg"},{"id":"f81","name":"日历从录音里自动提取待办","product":"calendar","productName":"日历","productColor":"#2563eb","desc":"OriginOS 7 日历可识别录音内容里的待办事项并自动生成日程，把「说完再手动记下来」这一步省掉。","note":"这条把录音机和日历打通了——录音机的产出不该只是一份音频和摘要，而是可落库的结构化日程。tOS 若已有会议转写，最值钱的下一步就是往日历/待办落，而不是再优化一次摘要措辞。","source":{"kind":"update","label":"系统更新 · OriginOS 7","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","brands":["vivo","iqoo"],"phoneIds":["vivoxfold6","vivs60","vivox500","iqoo15t","iqooneo11"],"img":"images/apps/calendar.svg"},{"id":"f82","name":"小 V 记忆卡：锁屏记录并关联上下文","product":"notes","productName":"记事本","productColor":"#16a34a","desc":"OriginOS 7 新增「小V记忆卡」，可在锁屏直接记录，并与既有上下文关联；配合小 V Pro 的长期记忆，把收藏的攻略、相册截图、历史笔记串成一份旅行路书。","note":"记事本的价值正从「记下来」转向「被 AI 取用」。做之前先定三件事：内容存在哪、AI 读取的粒度、用户能否查看并删除某条记忆。记忆可见可控是信任前提，缺了它功能越强越吓人。","source":{"kind":"update","label":"系统更新 · OriginOS 7","href":"updates/vivo-originos.html","url":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html"},"ext":"https://www.fonearena.com/blog/492411/vivo-originos-7-features-preview-program-registrations-india.html","brand":"vivo","b mg":"images/apps/recorder.svg"},{"id":"f89","name":"文件管理文档扫描：弯曲书页校正 + 去手指","product":"files","productName":"文件管理","productColor":"#d97706","desc":"One UI 9 的 My Files 文档扫描升级：自动校正弯曲书页/折角，并去除握纸手指，填补此前 S25 缺失的部分功能。","note":"扫描去手指/弯页是“拍文档”场景的真痛点，但这类能力更适合放在相机或专门的扫描 App，放在文件管理里入口偏深。若 tOS 做文档扫描，建议独立入口 + 自动检测文档边缘触发，而不是埋在文件管理器三级菜单。","source":{"kind":"update","label":"系统更新 · One UI 9","href":"updates/samsung-my-files.html","url":"https://gadgets.beebom.com/guides/best-one-ui-9-features"},"ext":"https://gadgets.beebom.com/guides/best-one-ui-9-features","brand":"samsung","brands":["samsung"],"phoneIds":["samsungs26","samsungzfold8"],"img":"images/apps/files.svg"}]};
const { phones: PHONES, brand: BRAND, brandOrder, products: PRODUCTS, rows: ROWS } = DATA;

let brandFilter = 'all';
let selPhone = new Set(PHONES.map(p => p.id));
let selProd = new Set(PRODUCTS.map(p => p.id));
let srcFilter = 'all';
let kw = '';
const phonesOfBrand = b => b === 'all' ? PHONES : PHONES.filter(p => p.brand === b);

(function applyQuery() {
  const qs = new URLSearchParams(location.search);
  const brand = qs.get('brand');
  const phones = (qs.get('phone') || '').split(',').filter(Boolean);
  const prods = (qs.get('product') || '').split(',').filter(Boolean);
  const src = qs.get('src');
  if (brand && (brand === 'all' || BRAND[brand])) {
    brandFilter = brand;
    selPhone = new Set(phonesOfBrand(brand).map(p => p.id));
  }
  if (phones.length) {
    const ok = phones.filter(id => PHONES.some(p => p.id === id));
    if (ok.length) {
      selPhone = new Set(ok);
      const brands = [...new Set(ok.map(id => PHONES.find(p => p.id === id).brand))];
      brandFilter = brands.length === 1 ? brands[0] : 'all';
    }
  }
  if (prods.length) {
    const ok = prods.filter(id => PRODUCTS.some(p => p.id === id));
    if (ok.length) selProd = new Set(ok);
  }
  if (src === 'launch' || src === 'update') srcFilter = src;
})();

function matched() {
  const k = kw.toLowerCase();
  return ROWS.filter(r => {
    if (!r.phoneIds.some(id => selPhone.has(id))) return false;
    if (!selProd.has(r.product)) return false;
    if (srcFilter !== 'all' && r.source.kind !== srcFilter) return false;
    if (!k) return true;
    const hay = (r.name + ' ' + r.desc + ' ' + r.note + ' ' + r.productName + ' ' + r.phoneIds.map(id => (PHONES.find(p=>p.id===id)||{}).name).join(' ')).toLowerCase();
    return hay.includes(k);
  });
}

function syncUrl() {
  const qs = new URLSearchParams();
  if (srcFilter !== 'all') qs.set('src', srcFilter);
  if (brandFilter !== 'all') qs.set('brand', brandFilter);
  const vis = phonesOfBrand(brandFilter);
  if (selPhone.size && selPhone.size < vis.length) qs.set('phone', [...selPhone].join(','));
  if (selProd.size && selProd.size < PRODUCTS.length) qs.set('product', [...selProd].join(','));
  const next = qs.toString();
  history.replaceState(null, '', next ? (location.pathname + '?' + next) : location.pathname);
}

function summarize(selected, all, one, many, allLabel) {
  const n = selected.length, tot = all.length;
  if (!n) return { v: '未选择', c: '' };
  if (n === tot) return { v: allLabel, c: tot + ' 项' };
  if (n === 1) return { v: selected[0], c: '' };
  if (n === 2) return { v: selected[0] + '、' + selected[1], c: '' };
  return { v: selected[0] + ' 等 ' + n + many, c: n + '/' + tot };
}

function setLab(idV, idC, info) {
  document.getElementById(idV).textContent = info.v;
  document.getElementById(idC).textContent = info.c;
}

function renderFilters() {
  const vis = phonesOfBrand(brandFilter);
  const visIds = new Set(vis.map(p => p.id));
  [...selPhone].forEach(id => { if (!visIds.has(id)) selPhone.delete(id); });

  document.getElementById('chips-src').innerHTML =
    [['all','全部来源'],['launch','发布会'],['update','系统更新']].map(([id, lab]) =>
      `<div class="chip ${srcFilter===id?'on':''}" data-src="${id}"><span class="nm">${lab}</span></div>`
    ).join('');
  document.querySelectorAll('[data-src]').forEach(el => el.onclick = () => { srcFilter = el.dataset.src; render(); });

  document.getElementById('chips-brand').innerHTML =
    `<div class="chip ${brandFilter==='all'?'on':''}" data-brand="all"><span class="nm">全部</span></div>` +
    brandOrder.map(id => {
      const b = BRAND[id];
      return `<div class="chip ${brandFilter===id?'on':''}" data-brand="${id}" style="color:${b.color}"><span class="dot"></span><span class="nm">${b.label}</span></div>`;
    }).join('');
  document.querySelectorAll('[data-brand]').forEach(el => el.onclick = () => {
    brandFilter = el.dataset.brand;
    selPhone = new Set(phonesOfBrand(brandFilter).map(p => p.id));
    render();
  });

  const phoneItems = brandOrder.map(bid => {
    const group = vis.filter(p => p.brand === bid);
    if (!group.length) return '';
    const b = BRAND[bid];
    return `<div class="dd-group">${b.label}</div>` + group.map(p =>
      `<label class="dd-item"><input type="checkbox" data-phone="${p.id}" ${selPhone.has(p.id)?'checked':''}><span class="dot" style="background:${b.color}"></span>${p.name}</label>`
    ).join('');
  }).join('');
  document.getElementById('panel-phone').innerHTML =
    `<div class="dd-head"><span>选择机型</span><span><button type="button" id="ph-all">全选</button> · <button type="button" id="ph-none">清空</button></span></div>` + phoneItems;

  document.getElementById('panel-prod').innerHTML =
    `<div class="dd-head"><span>选择产品</span><span><button type="button" id="pr-all">全选</button> · <button type="button" id="pr-none">清空</button></span></div>` +
    PRODUCTS.map(p =>
      `<label class="dd-item"><input type="checkbox" data-prod="${p.id}" ${selProd.has(p.id)?'checked':''}><span class="dot" style="background:${p.color}"></span>${p.name}</label>`
    ).join('');

  document.querySelectorAll('[data-phone]').forEach(el => el.onchange = () => {
    el.checked ? selPhone.add(el.dataset.phone) : selPhone.delete(el.dataset.phone);
    render(true);
  });
  document.querySelectorAll('[data-prod]').forEach(el => el.onchange = () => {
    el.checked ? selProd.add(el.dataset.prod) : selProd.delete(el.dataset.prod);
    render(true);
  });
  document.getElementById('ph-all').onclick = () => { selPhone = new Set(vis.map(p => p.id)); render(true); };
  document.getElementById('ph-none').onclick = () => { selPhone = new Set(); render(true); };
  document.getElementById('pr-all').onclick = () => { selProd = new Set(PRODUCTS.map(p => p.id)); render(true); };
  document.getElementById('pr-none').onclick = () => { selProd = new Set(); render(true); };

  const pickedPhones = vis.filter(p => selPhone.has(p.id));
  const pickedProds = PRODUCTS.filter(p => selProd.has(p.id));
  setLab('lab-phone', 'n-phone', summarize(pickedPhones.map(p => p.name), vis, '', ' 台', brandFilter==='all' ? '全部机型' : (BRAND[brandFilter]||{}).label + '全部'));
  setLab('lab-prod', 'n-prod', summarize(pickedProds.map(p => p.name), PRODUCTS, '', ' 个', '全部产品'));
}

function toggleDd(id, ev) {
  ev.stopPropagation();
  document.querySelectorAll('.dd').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
  document.getElementById(id).classList.toggle('open');
}

function render(keepOpen) {
  const openPhone = keepOpen && document.getElementById('dd-phone').classList.contains('open');
  const openProd = keepOpen && document.getElementById('dd-prod').classList.contains('open');
  renderFilters();
  if (openPhone) document.getElementById('dd-phone').classList.add('open');
  if (openProd) document.getElementById('dd-prod').classList.add('open');
  syncUrl();

  const rows = matched();
  document.getElementById('countline').innerHTML = `共 <b>${rows.length}</b> 项`;
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td class="empty" colspan="7">没有匹配项。请至少选一台手机、一个产品，或清空搜索。</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map((r, i) => {
    const shownPhones = r.phoneIds
      .filter(id => selPhone.has(id))
      .map(id => PHONES.find(p => p.id === id))
      .filter(Boolean);
    const brandIds = [...new Set(shownPhones.map(p => p.brand))];
    const brandHtml = brandIds.map(id => {
      const b = BRAND[id] || { label: id, color: '#888' };
      return `<span class="bname"><i style="background:${b.color}"></i>${b.label}</span>`;
    }).join('');
    const srcKind = r.source.kind === 'launch' ? '发布会' : '系统更新';
    const srcCls = r.source.kind === 'launch' ? 'src launch' : 'src';
    const extAttr = r.source.href && r.source.href.indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '';
    const src = r.source.href
      ? `<a class="${srcCls}" href="${r.source.href}"${extAttr}>${srcKind} · ${r.source.label.replace(/^发布会 · |^系统更新 · /, '')} →</a>`
      : '';
    const reportLinks = shownPhones.slice(0, 1).map(p =>
      `<a class="src launch" href="reports/${p.id}.html">发布会 · ${p.name} →</a>`
    ).join('');
    const phoneLinks = shownPhones.map(p => `<a href="reports/${p.id}.html">${p.name}</a>`).join(' · ');
    let extHtml = '';
    if (r.ext) {
      try {
        const extDomain = new URL(r.ext).hostname.replace(/^www\./, '');
        extHtml = `<a class="src ext" href="${r.ext}" target="_blank" rel="noopener" title="外网来源原文">${extDomain} ↗</a>`;
      } catch (e) {}
    }
    return `<tr>
      <td class="c-img"><img src="${r.img}" alt="${r.productName}"></td>
      <td class="c-no">${i+1}</td>
      <td class="c-brand">
        ${brandHtml}
        <span class="phones">${phoneLinks}</span>
      </td>
      <td class="c-name"><b>${r.name}</b><span class="src-row">${src}${r.source.kind==='update' ? reportLinks : ''}${extHtml}</span></td>
      <td class="c-mod"><span class="mtag" style="color:${r.productColor};background:${r.productColor}18">${r.productName}</span></td>
      <td class="c-desc">${r.desc}</td>
      <td class="c-note">${r.note}</td>
    </tr>`;
  }).join('');
}

document.getElementById('btn-phone').onclick = e => toggleDd('dd-phone', e);
document.getElementById('btn-prod').onclick = e => toggleDd('dd-prod', e);
document.getElementById('panel-phone').onclick = e => e.stopPropagation();
document.getElementById('panel-prod').onclick = e => e.stopPropagation();
document.addEventListener('click', () => document.querySelectorAll('.dd').forEach(d => d.classList.remove('open')));
document.getElementById('q').oninput = e => { kw = e.target.value.trim(); render(true); };
render();
</script>
</body>
</html>
